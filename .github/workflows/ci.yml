name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run mocked shell tests
        run: |
          tests/test-resolve-service-token.sh
          tests/test-github-actions-template-integration.sh
          SIM_USERS=25 tests/test-many-users-simulation.sh
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
      - name: Run actionlint
        run: |
          ACTIONLINT_BIN="$(go env GOPATH)/bin/actionlint"
          "$ACTIONLINT_BIN"
