name: postman-resolve-service-token-action
description: Resolves Postman auth for CSE automations by passing through an access token or minting one from a service-account API key.
inputs:
  postman-api-key:
    description: Postman API key (PMAK). Use a service-account API key to mint a short-lived access token. Required when postman-access-token is not provided.
    required: false
    default: ""
  postman-access-token:
    description: Optional pre-existing Postman access token. When provided, the mint step is skipped and this value is returned via outputs.token. If postman-team-id is omitted, the action attempts Bearer-only /me lookup, which may not be supported by every Postman token type.
    required: false
    default: ""
  postman-team-id:
    description: Optional pre-known Postman team ID. When provided, the team ID lookup is skipped and this value is returned via outputs.team-id. Recommended when supplying postman-access-token directly.
    required: false
    default: ""
  postman-stack:
    description: "Postman stack profile. One of: prod (api.getpostman.com) or beta (api.getpostman-beta.com)."
    required: false
    default: prod
  write-github-secret:
    description: When 'true', writes the resolved token and team ID to repo secrets named by access-token-secret-name and team-id-secret-name. Requires github-token to be a PAT (or GitHub App installation token) with secrets write permission on the target repo. The default GITHUB_TOKEN cannot write repo secrets.
    required: false
    default: 'false'
  access-token-secret-name:
    description: Repo secret name to receive the resolved access token. Used only when write-github-secret is 'true'.
    required: false
    default: POSTMAN_ACCESS_TOKEN
  team-id-secret-name:
    description: Repo secret name to receive the resolved team ID. Used only when write-github-secret is 'true'.
    required: false
    default: POSTMAN_TEAM_ID
  github-token:
    description: GitHub PAT or App installation token with secrets write permission on the target repo. Required when write-github-secret is 'true'.
    required: false
    default: ""
outputs:
  token:
    description: Resolved Postman access token. Kept for backward compatibility; prefer access-token for new workflows.
    value: ${{ steps.resolve.outputs.token }}
  access-token:
    description: Resolved Postman access token. Either minted from postman-api-key or passed through from postman-access-token.
    value: ${{ steps.resolve.outputs.access-token }}
  team-id:
    description: Resolved Postman team ID. Either looked up via /me or passed through from the postman-team-id input.
    value: ${{ steps.resolve.outputs.team-id }}
  skipped:
    description: "'true' when the mint step was skipped because postman-access-token was provided as input."
    value: ${{ steps.resolve.outputs.skipped }}
  auth-method:
    description: "Resolved auth path: provided-access-token or service-account-api-key."
    value: ${{ steps.resolve.outputs.auth-method }}
  token-expires-at:
    description: Expiration timestamp returned by the service-account token endpoint when available. Empty for provided access tokens or endpoint responses without expiry metadata.
    value: ${{ steps.resolve.outputs.token-expires-at }}
  token-expires-in:
    description: Token lifetime in seconds returned by the service-account token endpoint when available. Empty for provided access tokens or endpoint responses without lifetime metadata.
    value: ${{ steps.resolve.outputs.token-expires-in }}
runs:
  using: composite
  steps:
    - id: validate
      name: Validate inputs
      shell: bash
      env:
        STACK: ${{ inputs.postman-stack }}
        WRITE: ${{ inputs.write-github-secret }}
        GH_TOKEN_INPUT: ${{ inputs.github-token }}
        EXISTING_TOKEN: ${{ inputs.postman-access-token }}
        POSTMAN_API_KEY: ${{ inputs.postman-api-key }}
      run: |
        set -euo pipefail
        case "$STACK" in
          prod|beta) ;;
          *)
            echo "::error::postman-stack must be one of: prod, beta; got: $STACK"
            exit 1
            ;;
        esac
        if [ -z "$EXISTING_TOKEN" ] && [ -z "$POSTMAN_API_KEY" ]; then
          echo "::error::postman-api-key is required when postman-access-token is not provided."
          exit 1
        fi
        if [ "$WRITE" = "true" ] && [ -z "$GH_TOKEN_INPUT" ]; then
          echo "::error::github-token is required when write-github-secret is 'true'. The default GITHUB_TOKEN cannot write repo secrets; use a PAT or GitHub App installation token with secrets write permission."
          exit 1
        fi

    - id: resolve
      name: Resolve service-account token and team ID
      shell: bash
      env:
        POSTMAN_API_KEY: ${{ inputs.postman-api-key }}
        EXISTING_TOKEN: ${{ inputs.postman-access-token }}
        EXISTING_TEAM_ID: ${{ inputs.postman-team-id }}
        STACK: ${{ inputs.postman-stack }}
      run: bash "$GITHUB_ACTION_PATH/scripts/resolve-service-token.sh"

    - id: write_secrets
      name: Write resolved values to repo secrets
      if: inputs.write-github-secret == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        TOKEN: ${{ steps.resolve.outputs.token }}
        TEAM_ID: ${{ steps.resolve.outputs.team-id }}
        ACCESS_TOKEN_SECRET_NAME: ${{ inputs.access-token-secret-name }}
        TEAM_ID_SECRET_NAME: ${{ inputs.team-id-secret-name }}
      run: bash "$GITHUB_ACTION_PATH/scripts/write-github-secrets.sh"
